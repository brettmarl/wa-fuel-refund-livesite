name: Update fuel tax rates

on:
  schedule:
    - cron: '23 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --no-audit --no-fund linkedom@0.18.13
      - run: node .github/rates/update.mjs rates.json
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.json
          git diff --cached --quiet && exit 0
          git commit -m 'Rates: weekly check of DOL rates'
          git push
